<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1025"/>
      <stop offset="100%" style="stop-color:#2a1b3d"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1b3d"/>
      <stop offset="100%" style="stop-color:#1a1025"/>
    </linearGradient>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5aa6"/>
      <stop offset="100%" style="stop-color:#ff3d8a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Kuromi checkerboard pattern -->
  <g opacity="0.06">
    <rect x="0" y="0" width="64" height="64" fill="white"/>
    <rect x="128" y="0" width="64" height="64" fill="white"/>
    <rect x="256" y="0" width="64" height="64" fill="white"/>
    <rect x="384" y="0" width="64" height="64" fill="white"/>
    <rect x="64" y="64" width="64" height="64" fill="white"/>
    <rect x="192" y="64" width="64" height="64" fill="white"/>
    <rect x="320" y="64" width="64" height="64" fill="white"/>
    <rect x="448" y="64" width="64" height="64" fill="white"/>
    <rect x="0" y="128" width="64" height="64" fill="white"/>
    <rect x="128" y="128" width="64" height="64" fill="white"/>
    <rect x="256" y="128" width="64" height="64" fill="white"/>
    <rect x="384" y="128" width="64" height="64" fill="white"/>
    <rect x="64" y="192" width="64" height="64" fill="white"/>
    <rect x="192" y="192" width="64" height="64" fill="white"/>
    <rect x="320" y="192" width="64" height="64" fill="white"/>
    <rect x="448" y="192" width="64" height="64" fill="white"/>
    <rect x="0" y="256" width="64" height="64" fill="white"/>
    <rect x="128" y="256" width="64" height="64" fill="white"/>
    <rect x="256" y="256" width="64" height="64" fill="white"/>
    <rect x="384" y="256" width="64" height="64" fill="white"/>
    <rect x="64" y="320" width="64" height="64" fill="white"/>
    <rect x="192" y="320" width="64" height="64" fill="white"/>
    <rect x="320" y="320" width="64" height="64" fill="white"/>
    <rect x="448" y="320" width="64" height="64" fill="white"/>
    <rect x="0" y="384" width="64" height="64" fill="white"/>
    <rect x="128" y="384" width="64" height="64" fill="white"/>
    <rect x="256" y="384" width="64" height="64" fill="white"/>
    <rect x="384" y="384" width="64" height="64" fill="white"/>
    <rect x="64" y="448" width="64" height="64" fill="white"/>
    <rect x="192" y="448" width="64" height="64" fill="white"/>
    <rect x="320" y="448" width="64" height="64" fill="white"/>
    <rect x="448" y="448" width="64" height="64" fill="white"/>
  </g>

  <!-- Floating hearts and stars -->
  <g opacity="0.4">
    <text x="60" y="90" font-size="28" fill="#ff5aa6">♥</text>
    <text x="420" y="80" font-size="20" fill="#c49dff">✦</text>
    <text x="50" y="440" font-size="18" fill="#c49dff">✦</text>
    <text x="430" y="450" font-size="24" fill="#ff5aa6">♥</text>
    <text x="120" y="55" font-size="14" fill="#ff8fc4">♥</text>
    <text x="380" y="470" font-size="16" fill="#ff8fc4">✦</text>
  </g>

  <!-- Kuromi hood -->
  <path d="M120 290c0-95 68-172 152-172s152 77 152 172c0 55-24 96-62 122-32 22-68 34-90 34s-58-12-90-34c-38-26-62-67-62-122z" fill="#fff8fb"/>

  <!-- Pointed Kuromi ears -->
  <path d="M165 188l22-110 32 92z" fill="url(#hoodGrad)"/>
  <path d="M347 188l-22-110-32 92z" fill="url(#hoodGrad)"/>
  <!-- Inner ear pink -->
  <path d="M178 170l10-68 16 58z" fill="#ff5aa6" opacity="0.5"/>
  <path d="M334 170l-10-68-16 58z" fill="#ff5aa6" opacity="0.5"/>

  <!-- Main hood -->
  <path d="M120 290c0-85 60-155 136-155s136 70 136 155c0 50-22 88-56 112-28 20-62 32-80 32s-52-12-80-32c-34-24-56-62-56-112z" fill="url(#hoodGrad)"/>

  <!-- Face -->
  <ellipse cx="256" cy="300" rx="95" ry="85" fill="#fff8fb"/>

  <!-- Kuromi skull on forehead -->
  <circle cx="230" cy="248" r="14" fill="white" stroke="#1a1025" stroke-width="3"/>
  <circle cx="282" cy="248" r="14" fill="white" stroke="#1a1025" stroke-width="3"/>
  <ellipse cx="256" cy="268" rx="10" ry="5" fill="white" stroke="#1a1025" stroke-width="2"/>
  <line x1="248" y1="268" x2="264" y2="268" stroke="#1a1025" stroke-width="2"/>

  <!-- Eyes -->
  <ellipse cx="216" cy="305" rx="16" ry="22" fill="#1a1025"/>
  <ellipse cx="296" cy="305" rx="16" ry="22" fill="#1a1025"/>
  <circle cx="220" cy="298" r="5" fill="#ffffff"/>
  <circle cx="300" cy="298" r="5" fill="#ffffff"/>

  <!-- Nose -->
  <ellipse cx="256" cy="328" rx="6" ry="4" fill="#1a1025"/>

  <!-- Kuromi smirk -->
  <path d="M240 345q16 2 32 0" stroke="#1a1025" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Blush -->
  <ellipse cx="190" cy="325" rx="14" ry="10" fill="#ff8fc4" opacity="0.45"/>
  <ellipse cx="322" cy="325" rx="14" ry="10" fill="#ff8fc4" opacity="0.45"/>

  <!-- Kuromi bow on left ear -->
  <g transform="translate(138, 90) rotate(-30) scale(1.5)">
    <ellipse cx="-10" cy="0" rx="14" ry="9" fill="url(#bowGrad)" stroke="#1a1025" stroke-width="2"/>
    <ellipse cx="10" cy="0" rx="14" ry="9" fill="url(#bowGrad)" stroke="#1a1025" stroke-width="2"/>
    <circle r="5" fill="#ff3d8a" stroke="#1a1025" stroke-width="1.5"/>
    <!-- Mini skull on bow center -->
    <circle cx="0" cy="-1" r="3.5" fill="white"/>
    <circle cx="-1.2" cy="-2" r="1" fill="#1a1025"/>
    <circle cx="1.2" cy="-2" r="1" fill="#1a1025"/>
  </g>

  <!-- Tail -->
  <path d="M360 380q30 10 40 35" stroke="url(#hoodGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <ellipse cx="405" cy="420" rx="10" ry="14" fill="#ff5aa6" transform="rotate(30 405 420)"/>
</svg>
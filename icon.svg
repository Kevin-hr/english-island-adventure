<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8fc4"/>
      <stop offset="55%" stop-color="#ff5aa6"/>
      <stop offset="100%" stop-color="#ff3d8a"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1b3d"/>
      <stop offset="100%" stop-color="#0d0814"/>
    </linearGradient>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5aa6"/>
      <stop offset="100%" stop-color="#ff3d8a"/>
    </linearGradient>
    <radialGradient id="faceShade" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe4f1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Kuromi checkerboard pattern (visible) -->
  <g opacity="0.22">
    <rect x="0" y="0" width="64" height="64" fill="#1a1025"/>
    <rect x="128" y="0" width="64" height="64" fill="#1a1025"/>
    <rect x="256" y="0" width="64" height="64" fill="#1a1025"/>
    <rect x="384" y="0" width="64" height="64" fill="#1a1025"/>
    <rect x="64" y="64" width="64" height="64" fill="#1a1025"/>
    <rect x="192" y="64" width="64" height="64" fill="#1a1025"/>
    <rect x="320" y="64" width="64" height="64" fill="#1a1025"/>
    <rect x="448" y="64" width="64" height="64" fill="#1a1025"/>
    <rect x="0" y="128" width="64" height="64" fill="#1a1025"/>
    <rect x="128" y="128" width="64" height="64" fill="#1a1025"/>
    <rect x="256" y="128" width="64" height="64" fill="#1a1025"/>
    <rect x="384" y="128" width="64" height="64" fill="#1a1025"/>
    <rect x="64" y="192" width="64" height="64" fill="#1a1025"/>
    <rect x="192" y="192" width="64" height="64" fill="#1a1025"/>
    <rect x="320" y="192" width="64" height="64" fill="#1a1025"/>
    <rect x="448" y="192" width="64" height="64" fill="#1a1025"/>
    <rect x="0" y="256" width="64" height="64" fill="#1a1025"/>
    <rect x="128" y="256" width="64" height="64" fill="#1a1025"/>
    <rect x="256" y="256" width="64" height="64" fill="#1a1025"/>
    <rect x="384" y="256" width="64" height="64" fill="#1a1025"/>
    <rect x="64" y="320" width="64" height="64" fill="#1a1025"/>
    <rect x="192" y="320" width="64" height="64" fill="#1a1025"/>
    <rect x="320" y="320" width="64" height="64" fill="#1a1025"/>
    <rect x="448" y="320" width="64" height="64" fill="#1a1025"/>
    <rect x="0" y="384" width="64" height="64" fill="#1a1025"/>
    <rect x="128" y="384" width="64" height="64" fill="#1a1025"/>
    <rect x="256" y="384" width="64" height="64" fill="#1a1025"/>
    <rect x="384" y="384" width="64" height="64" fill="#1a1025"/>
    <rect x="64" y="448" width="64" height="64" fill="#1a1025"/>
    <rect x="192" y="448" width="64" height="64" fill="#1a1025"/>
    <rect x="320" y="448" width="64" height="64" fill="#1a1025"/>
    <rect x="448" y="448" width="64" height="64" fill="#1a1025"/>
  </g>

  <!-- Soft pink halo behind character -->
  <circle cx="256" cy="262" r="190" fill="#ffe4f1" opacity="0.32"/>

  <!-- Decorative hearts & stars (white, readable) -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M70 96 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
    <path d="M442 86 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <circle cx="58" cy="420" r="6"/>
    <circle cx="454" cy="436" r="7"/>
    <path d="M90 460 l3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 z"/>
  </g>
  <g fill="#1a1025" opacity="0.55">
    <path d="M420 410 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
  </g>

  <!-- ===== Kuromi character ===== -->

  <!-- Jester hood back (envelope around head) -->
  <path d="M118 296c0-102 62-178 138-178s138 76 138 178c0 50-22 92-58 120-32 26-62 38-80 38s-48-12-80-38c-36-28-58-70-58-120z" fill="url(#hoodGrad)"/>

  <!-- Left jester ear (points up-back) -->
  <path d="M150 200c-28-44-44-92-30-140 24 26 50 60 62 98 6 16-2 32-12 42-8 8-20 6-20 0z" fill="url(#hoodGrad)"/>
  <!-- Right jester ear (points up-back) -->
  <path d="M362 200c28-44 44-92 30-140-24 26-50 60-62 98-6 16 2 32 12 42 8 8 20 6 20 0z" fill="url(#hoodGrad)"/>

  <!-- Pink inner ears -->
  <path d="M158 188c-14-24-24-54-18-86 14 16 30 38 38 62 4 10-2 22-12 26-5 2-8-1-8-2z" fill="#ff5aa6" opacity="0.65"/>
  <path d="M354 188c14-24 24-54 18-86-14 16-30 38-38 62-4 10 2 22 12 26 5 2 8-1 8-2z" fill="#ff5aa6" opacity="0.65"/>

  <!-- Face -->
  <ellipse cx="256" cy="296" rx="98" ry="88" fill="url(#faceShade)"/>

  <!-- ===== Signature pink skull on forehead ===== -->
  <g transform="translate(256, 236)">
    <!-- Skull dome -->
    <path d="M-32 4c0-24 18-40 32-40s32 16 32 40c0 12-6 22-14 28l3 14c2 8-4 14-12 14h-18c-8 0-14-6-12-14l3-14c-8-6-14-16-14-28z" fill="#ff5aa6" stroke="#1a1025" stroke-width="3"/>
    <!-- Eye sockets -->
    <ellipse cx="-13" cy="2" rx="7" ry="9" fill="#1a1025"/>
    <ellipse cx="13" cy="2" rx="7" ry="9" fill="#1a1025"/>
    <!-- Nose hole -->
    <path d="M-3 16 L0 22 L3 16 Z" fill="#1a1025"/>
    <!-- Teeth line -->
    <rect x="-10" y="28" width="20" height="6" rx="1.5" fill="#1a1025"/>
    <line x1="-4" y1="28" x2="-4" y2="34" stroke="#ff5aa6" stroke-width="1.2"/>
    <line x1="4" y1="28" x2="4" y2="34" stroke="#ff5aa6" stroke-width="1.2"/>
  </g>

  <!-- Eyes -->
  <ellipse cx="216" cy="312" rx="17" ry="23" fill="#1a1025"/>
  <ellipse cx="296" cy="312" rx="17" ry="23" fill="#1a1025"/>
  <circle cx="222" cy="302" r="5" fill="#ffffff"/>
  <circle cx="302" cy="302" r="5" fill="#ffffff"/>
  <circle cx="210" cy="320" r="2" fill="#ffffff"/>
  <circle cx="290" cy="320" r="2" fill="#ffffff"/>

  <!-- Nose -->
  <ellipse cx="256" cy="338" rx="6" ry="4" fill="#1a1025"/>

  <!-- Signature smirk (right side up) -->
  <path d="M238 358 Q252 370 278 354" stroke="#1a1025" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M270 358 Q274 356 278 354" stroke="#1a1025" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Blush -->
  <ellipse cx="188" cy="338" rx="14" ry="9" fill="#ff8fc4" opacity="0.55"/>
  <ellipse cx="324" cy="338" rx="14" ry="9" fill="#ff8fc4" opacity="0.55"/>

  <!-- ===== Pink bow on RIGHT ear ===== -->
  <g transform="translate(360, 120) rotate(28) scale(1.4)">
    <ellipse cx="-13" cy="0" rx="14" ry="10" fill="url(#bowGrad)" stroke="#1a1025" stroke-width="2.2"/>
    <ellipse cx="13" cy="0" rx="14" ry="10" fill="url(#bowGrad)" stroke="#1a1025" stroke-width="2.2"/>
    <circle r="6.5" fill="#ff3d8a" stroke="#1a1025" stroke-width="2"/>
    <circle r="2.2" fill="#ffe4f1"/>
  </g>

  <!-- ===== Round pom-pom tail (right side) ===== -->
  <circle cx="392" cy="396" r="16" fill="#ff5aa6" stroke="#1a1025" stroke-width="3"/>
  <circle cx="388" cy="392" r="4" fill="#ffe4f1" opacity="0.7"/>
</svg>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff3d8a" />
    <meta name="description" content="面向5–7岁儿童的英语冒险闯关游戏。和库洛米一起完成28关学习冒险——骷髅头蝴蝶结的暗黑可爱世界。" />
    <title>英语岛大冒险 · Kuromi Zone</title>
    <link rel="manifest" href="manifest.webmanifest?v=13" />
    <link rel="icon" href="icon.svg?v=13" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <!-- Kuromi floating decorative particles layer -->
    <div class="particles" aria-hidden="true">
      <div class="particle skull" style="left:6%;top:10%;animation-delay:0s;font-size:18px;">💀</div>
      <div class="particle heart" style="left:15%;top:32%;animation-delay:1.2s;">🖤</div>
      <div class="particle bow" style="left:88%;top:15%;animation-delay:2.5s;">🎀</div>
      <div class="particle star" style="left:75%;top:62%;animation-delay:0.8s;">✦</div>
      <div class="particle moon" style="left:4%;top:68%;animation-delay:3.1s;">🌙</div>
      <div class="particle skull" style="left:93%;top:42%;animation-delay:1.8s;font-size:16px;">☠</div>
      <div class="particle heart" style="left:48%;top:6%;animation-delay:4.2s;">♥</div>
      <div class="particle star" style="left:62%;top:90%;animation-delay:2.0s;">✦</div>
      <div class="particle bow" style="left:30%;top:85%;animation-delay:3.5s;font-size:16px;">🎀</div>
      <div class="particle skull" style="left:82%;top:78%;animation-delay:0.5s;font-size:14px;">💀</div>
    </div>

    <div class="app-shell" id="app-shell">
      <header class="topbar">
        <button class="brand" id="home-button" aria-label="返回英语岛地图">
          <span class="brand-mark" aria-hidden="true">🐈‍⬛</span>
          <span>
            <strong>英语岛大冒险</strong>
            <small id="brand-subtitle">Kuromi Zone ☠</small>
          </span>
        </button>

        <div class="topbar-actions">
          <div class="spark-counter" aria-label="库洛米星星">
            <span aria-hidden="true">✦</span>
            <strong id="spark-count">0</strong>
          </div>
          <button class="icon-button" id="sound-toggle" aria-label="关闭声音">🔊</button>
          <button class="parent-button" id="parent-button">家长区 💀</button>
        </div>
      </header>

      <main id="screen" class="screen" aria-live="polite"></main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="modal" id="parent-gate-dialog">
      <form method="dialog" class="modal-card" id="parent-gate-form">
        <button class="modal-close" value="cancel" aria-label="关闭">×</button>
        <div class="modal-icon" aria-hidden="true">🎀</div>
        <h2>家长验证</h2>
        <p>请回答：<strong id="gate-question">7 + 5 = ?</strong></p>
        <label class="sr-only" for="gate-answer">答案</label>
        <input id="gate-answer" class="gate-input" inputmode="numeric" autocomplete="off" placeholder="输入答案" required />
        <p class="form-error" id="gate-error"></p>
        <button class="primary-button wide" value="default">进入家长区</button>
      </form>
    </dialog>

    <dialog class="modal parent-modal" id="parent-panel-dialog">
      <section class="modal-card parent-panel">
        <button class="modal-close" id="close-parent-panel" aria-label="关闭">×</button>
        <div class="parent-heading">
          <div class="modal-icon" aria-hidden="true">💀</div>
          <div>
            <p class="eyebrow">Kuromi Zone</p>
            <h2>本机学习报告</h2>
          </div>
        </div>
        <div id="parent-report"></div>
      </section>
    </dialog>

    <dialog class="modal" id="break-dialog">
      <section class="modal-card break-card">
        <div class="modal-icon" aria-hidden="true">🌙</div>
        <h2>今天航行得很棒</h2>
        <p>眼睛和身体也要休息一下。去喝水、看看远处吧。</p>
        <button class="primary-button wide" id="finish-session">今天完成</button>
        <button class="text-button" id="parent-continue">家长继续本次航行</button>
      </section>
    </dialog>

    <noscript>这个游戏需要启用 JavaScript。</noscript>
    <script src="game-core.js?v=13"></script>
    <script src="levels.js?v=13"></script>
    <script src="app.js?v=13"></script>
  </body>
</html>
